name: Release JetPrint Desktop Kiosk

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_type:
        description: "Version bump type"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: "Custom semver version (e.g. 0.2.5) when release_type is custom"
        required: false
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.bump.outputs.tag_name }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump version, commit, and push tag
        id: bump
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
        run: |
          NEW_VER=$(node -e '
            const fs = require("fs");
            const type = process.env.RELEASE_TYPE;
            const custom = (process.env.CUSTOM_VERSION || "").trim();
            const semverRe = /^(\d+)\.(\d+)\.(\d+)$/;

            const tauriPath = "desktop-kiosk/src-tauri/tauri.conf.json";
            const pkgPath = "desktop-kiosk/package.json";
            const cargoPath = "desktop-kiosk/src-tauri/Cargo.toml";

            const tauriConf = JSON.parse(fs.readFileSync(tauriPath, "utf8"));
            const m = semverRe.exec(String(tauriConf.version || "").trim());
            if (!m) throw new Error("Invalid current version in tauri.conf.json");

            let next;
            if (type === "patch") next = `${m[1]}.${m[2]}.${Number(m[3]) + 1}`;
            else if (type === "minor") next = `${m[1]}.${Number(m[2]) + 1}.0`;
            else if (type === "major") next = `${Number(m[1]) + 1}.0.0`;
            else if (type === "custom") {
              if (!semverRe.test(custom)) throw new Error(`Invalid custom_version: ${custom}`);
              next = custom;
            } else {
              throw new Error(`Unsupported release_type: ${type}`);
            }

            tauriConf.version = next;
            fs.writeFileSync(tauriPath, JSON.stringify(tauriConf, null, 2) + "\n");

            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            pkg.version = next;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");

            const cargo = fs.readFileSync(cargoPath, "utf8");
            fs.writeFileSync(cargoPath, cargo.replace(/^version\s*=\s*"[^"]+"/m, `version = "${next}"`));

            process.stdout.write(next);
          ')
          TAG="v$NEW_VER"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add desktop-kiosk/src-tauri/tauri.conf.json desktop-kiosk/package.json desktop-kiosk/src-tauri/Cargo.toml
          git commit -m "chore: release $TAG"
          git push origin main
          git tag "$TAG"
          git push origin "$TAG"

          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: prepare-release
    if: always() && (github.event_name == 'push' || needs.prepare-release.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop-kiosk/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-kiosk/src-tauri

      - name: Install Linux dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libcups2-dev

      - name: Install frontend dependencies
        working-directory: desktop-kiosk
        run: npm ci

      - name: Build and publish Tauri app + updater.json
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop-kiosk
          tagName: ${{ needs.prepare-release.outputs.tag_name || github.ref_name }}
          releaseName: "JetPrint ${{ needs.prepare-release.outputs.tag_name || github.ref_name }}"
          releaseBody: "See the assets to download and install this version."
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
