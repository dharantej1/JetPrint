name: Release JetPrint Desktop Kiosk

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: ubuntu-22.04-arm
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop-kiosk/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-kiosk/src-tauri

      - name: Install Linux dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libcups2-dev

      - name: Install frontend dependencies
        working-directory: desktop-kiosk
        run: npm ci

      - name: Sync version from git tag
        run: |
          node -e '
            const fs = require("fs");
            const ver = (process.env.GITHUB_REF_NAME || "").replace(/^v/, "");
            if (!/^\d+\.\d+\.\d+$/.test(ver)) {
              throw new Error(`Invalid release tag version: ${process.env.GITHUB_REF_NAME}`);
            }

            const tauriPath = "desktop-kiosk/src-tauri/tauri.conf.json";
            const pkgPath = "desktop-kiosk/package.json";
            const cargoPath = "desktop-kiosk/src-tauri/Cargo.toml";

            const tauriConf = JSON.parse(fs.readFileSync(tauriPath, "utf8"));
            tauriConf.version = ver;
            fs.writeFileSync(tauriPath, JSON.stringify(tauriConf, null, 2) + "\n");

            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            pkg.version = ver;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");

            const cargo = fs.readFileSync(cargoPath, "utf8");
            fs.writeFileSync(cargoPath, cargo.replace(/^version\s*=\s*"[^"]+"/m, `version = "${ver}"`));

            console.log(`Synced version to ${ver}`);
          '

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop-kiosk
          tagName: ${{ github.ref_name }}
          releaseName: "JetPrint ${{ github.ref_name }}"
          releaseBody: "See the assets to download and install this version."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          updaterJsonPreferNsis: true
          retryAttempts: 3
          args: ${{ matrix.args }}

  consolidate-updater:
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Consolidate and upload unified latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node .github/scripts/consolidate-latest-json.js
